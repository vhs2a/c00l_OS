name: Build c00l_OS ISO

# The easiest way to get the real .iso with zero Linux machine of your own:
# push this project to a GitHub repo, then run this workflow (Actions tab ->
# "Build c00l_OS ISO" -> "Run workflow"). It builds on GitHub's own Ubuntu
# runner (which has internet + live-build), and the finished c00l_OS.iso
# shows up as a downloadable build artifact when it's done (~20-40 min).

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "live-build/**"
      - ".github/workflows/build-iso.yml"

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build live-boot live-config

      - name: Free up disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          sudo docker image prune -a -f || true

      - name: Build the ISO
        working-directory: live-build
        run: |
          sudo lb clean --purge || true
          sudo lb config \
            --architecture amd64 \
            --distribution bookworm \
            --archive-areas "main contrib non-free non-free-firmware" \
            --binary-images iso-hybrid \
            --iso-application "c00l_OS" \
            --iso-volume "c00l_OS"
          sudo lb build 2>&1 | tee build.log

      - name: Collect the ISO
        run: |
          mkdir -p out
          iso=$(ls live-build/live-image-*.hybrid.iso 2>/dev/null | head -n1)
          if [ -z "$iso" ]; then
            echo "No ISO produced -- see the build log below." >&2
            tail -n 200 live-build/build.log || true
            exit 1
          fi
          mv "$iso" out/c00l_OS.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: c00l_OS-iso
          path: out/c00l_OS.iso
          retention-days: 14

      - name: Upload build log (for troubleshooting)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: live-build/build.log
          retention-days: 14
