name: Build c00l_OS ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-c00l-os-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build bootable ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install live-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            live-boot \
            live-config \
            xorriso \
            debootstrap

      - name: Check build files
        run: |
          test -f build.sh || {
            echo "::error::build.sh was not found in the repository root."
            exit 1
          }
          test -d live-build || {
            echo "::error::The live-build directory was not found. Add your live-build configuration to the repository."
            exit 1
          }

      - name: Build c00l_OS
        run: sudo bash ./build.sh

      - name: Verify ISO
        run: |
          test -s out/c00l_OS.iso || {
            echo "::error::Build completed without producing out/c00l_OS.iso"
            exit 1
          }
          ls -lh out/c00l_OS.iso
          sha256sum out/c00l_OS.iso | tee out/c00l_OS.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: c00l_OS-bootable-ISO
          path: |
            out/c00l_OS.iso
            out/c00l_OS.iso.sha256
          if-no-files-found: error
          retention-days: 14
