<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>c00l_OS</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    background: #0a0a0c;
    background-image:
      linear-gradient(rgba(205,28,38,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(205,28,38,0.06) 1px, transparent 1px);
    background-size: 42px 42px;
    color: #e8e8e8;
    font-family: "DejaVu Sans Mono", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  h1 {
    font-size: 54px;
    letter-spacing: 2px;
    color: #cd1c26;
    text-shadow: 0 0 18px rgba(205,28,38,0.55);
    margin-bottom: 6px;
  }
  p.tag { color: #8a8a8c; margin-top: 0; margin-bottom: 36px; }
  form { display: flex; width: 560px; max-width: 86vw; }
  input[type=text] {
    flex: 1;
    background: #101013;
    border: 2px solid #5a0e13;
    color: #e8e8e8;
    font-family: inherit;
    font-size: 16px;
    padding: 12px 14px;
    outline: none;
  }
  input[type=text]:focus { border-color: #cd1c26; }
  button {
    background: #101013;
    border: 2px solid #cd1c26;
    border-left: none;
    color: #cd1c26;
    font-family: inherit;
    font-weight: bold;
    padding: 0 20px;
    cursor: pointer;
  }
  button:hover { background: #cd1c26; color: #000; }
  .links { margin-top: 34px; display: flex; gap: 22px; }
  .links a { color: #8a8a8c; text-decoration: none; font-size: 13px; border-bottom: 1px dashed transparent; }
  .links a:hover { color: #cd1c26; border-bottom-color: #cd1c26; }
  footer { position: fixed; bottom: 14px; color: #3d3d3f; font-size: 11px; }
</style>
</head>
<body>
  <h1>c00l_OS</h1>
  <p class="tag">// your browser. on your OS. no cloud required.</p>
  <form action="https://duckduckgo.com/html/" method="get" target="_self">
    <input type="text" name="q" placeholder="search the web..." autofocus>
    <button type="submit">GO</button>
  </form>
  <div class="links">
    <a href="https://duckduckgo.com">duckduckgo</a>
    <a href="https://wikipedia.org">wikipedia</a>
    <a href="https://news.ycombinator.com">hacker news</a>
    <a href="file:///opt/c00l-os/www/about.html">about c00l_OS</a>
  </div>
  <footer>c00l_browser — built on WebKitGTK</footer>
</body>
</html>
